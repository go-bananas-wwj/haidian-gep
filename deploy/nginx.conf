server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://task-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Loopback-only demo identity. Replace with authenticated proxy identity before public exposure.
        proxy_set_header X-GEP-Actor "demo-reviewer";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
