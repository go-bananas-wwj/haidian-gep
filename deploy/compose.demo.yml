services:
  task-api:
    build: ..
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--database", "/var/lib/haidian-gep/tasks.sqlite3"]
    environment:
      GEP_DATA_ROOT: /var/lib/haidian-gep-data
      # Values come only from a host-restricted environment file, never this repository.
      DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORK_ORDER_INPUT: ${DIFY_WORK_ORDER_INPUT:-work_order_json}
      DIFY_CANDIDATE_OUTPUT: ${DIFY_CANDIDATE_OUTPUT:-candidate_json}
      DIFY_WORKFLOW_USER: ${DIFY_WORKFLOW_USER:-haidian-gep-task-service}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-30}
    volumes:
      - ${GEP_RUNTIME_DIR:?Set GEP_RUNTIME_DIR to the persistent runtime directory}:/var/lib/haidian-gep
      - ${GEP_DATA_DIR:?Set GEP_DATA_DIR to the admitted data directory}:/var/lib/haidian-gep-data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  task-worker:
    build: ..
    command: ["worker", "--database", "/var/lib/haidian-gep/tasks.sqlite3"]
    environment:
      GEP_DATA_ROOT: /var/lib/haidian-gep-data
      DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORK_ORDER_INPUT: ${DIFY_WORK_ORDER_INPUT:-work_order_json}
      DIFY_CANDIDATE_OUTPUT: ${DIFY_CANDIDATE_OUTPUT:-candidate_json}
      DIFY_WORKFLOW_USER: ${DIFY_WORKFLOW_USER:-haidian-gep-task-service}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-30}
    volumes:
      - ${GEP_RUNTIME_DIR:?Set GEP_RUNTIME_DIR to the persistent runtime directory}:/var/lib/haidian-gep
      - ${GEP_DATA_DIR:?Set GEP_DATA_DIR to the admitted data directory}:/var/lib/haidian-gep-data:ro
    restart: unless-stopped

  task-web:
    image: nginx:1.27.4-alpine
    ports:
      - "127.0.0.1:9088:8080"
    volumes:
      - ../gep/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      task-api:
        condition: service_healthy
    restart: unless-stopped
