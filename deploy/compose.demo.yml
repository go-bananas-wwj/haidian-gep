services:
  task-api:
    build: ..
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--database", "/var/lib/haidian-gep/tasks.sqlite3"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime:/var/lib/haidian-gep
    restart: unless-stopped

  task-web:
    build: ..
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--database", "/var/lib/haidian-gep/tasks.sqlite3"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/var/lib/haidian-gep
    restart: unless-stopped
