<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>海淀区 2024 GEP 核算任务</title>
  <style>
    :root{font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#172033;background:#f7f8fa}body{margin:0}.shell{max-width:1280px;margin:auto;background:#fff;min-height:100vh}.head,.bar{padding:16px 24px;border-bottom:1px solid #e7eaf0;display:flex;justify-content:space-between;gap:16px;align-items:center}.head small,.muted{color:#667085}.bar{background:#fbfcfe;flex-wrap:wrap}.grid{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.group{border:1px solid #dde3ee;border-radius:10px;padding:14px;background:#fcfdff}.group h2{font-size:16px;margin:0 0 10px}.node{width:100%;text-align:left;margin:5px 0;padding:9px;border:1px solid #e4e9f1;background:white;border-radius:6px;cursor:pointer}.node:hover{border-color:#3370ff}.state{float:right;font-size:12px;color:#a15c00}.panel{margin:0 24px 24px;padding:18px;border:1px solid #dce5f5;border-radius:10px;background:#f9fbff}.panel[hidden]{display:none}button{padding:8px 12px;border-radius:6px;border:1px solid #cbd5e1;background:white;cursor:pointer}.primary{background:#3370ff;color:white;border-color:#3370ff}input{padding:8px;border:1px solid #cbd5e1;border-radius:5px}dialog{max-width:620px;border:1px solid #d9e1ef;border-radius:10px;box-shadow:0 16px 45px #17203335}pre{white-space:pre-wrap;word-break:break-word;background:#f4f6fa;padding:12px;border-radius:6px}
  </style>
</head>
<body><main class="shell">
  <header class="head"><div><strong>GEP 智能核算</strong><small>　海淀区 · 2024 年 · 366 天</small></div><span id="task-state" class="muted">创建任务以加载真实参考数据</span></header>
  <section class="bar"><div>边界 <input id="boundary" value="pending-confirmation">　数据版本 <input id="data-version" value="reference-2024-v0.1"></div><button id="create" class="primary">新建核算任务</button><button id="freeze" disabled>生成核算快照</button></section>
  <section id="message" class="panel">当前仅加载已审核参考包；缺少来源或待审核输入不会被当作零值，且不能生成正式总 GEP。</section>
  <section id="graph" class="grid" aria-live="polite"></section>
  <dialog id="detail"><button id="close">关闭</button><h2 id="detail-title"></h2><p id="detail-state" class="muted"></p><pre id="detail-body"></pre><div id="actions"></div></dialog>
</main><script>
const state={task:null,nodes:[]};const q=s=>document.querySelector(s);const api=(path,opts={})=>fetch(path,{headers:{'Content-Type':'application/json'},...opts}).then(async r=>{const body=await r.json();if(!r.ok)throw Object.assign(new Error(body.error),{body,status:r.status});return body});
const label=n=>n.review_status==='approved'?'审核通过':n.review_status==='pending_review'?'待审核':n.acquisition_status==='awaiting_agent'?'待智能体补充':'待人工协助';
function render(){const graph=q('#graph');graph.replaceChildren();for(const category of ['material','regulating','cultural']){const box=document.createElement('section');box.className='group';const names={material:'物质产品',regulating:'调节服务',cultural:'文化服务'};box.innerHTML='<h2>'+names[category]+'</h2>';for(const node of state.nodes.filter(n=>n.kind==='indicator'&&n.category===category)){const b=document.createElement('button');b.className='node';b.textContent=node.node_key+' · '+node.label;const s=document.createElement('span');s.className='state';s.textContent=label(node);b.append(s);b.onclick=()=>show(node);box.append(b)}graph.append(box)}}
async function show(node){let details=node;if(node.node_key==='P1'){details=state.nodes.find(n=>n.node_key==='P1.maize.quantity')||node}const evidence=await api('/nodes/'+details.node_id+'/evidence');q('#detail-title').textContent=details.label;q('#detail-state').textContent=label(evidence)+' · 版本 '+evidence.version;q('#detail-body').textContent=JSON.stringify({value:evidence.value,unit:evidence.unit,evidence:evidence.evidence},null,2);const actions=q('#actions');actions.replaceChildren();if(evidence.review_status==='pending_review'){const approve=document.createElement('button');approve.className='primary';approve.textContent='审核通过';approve.onclick=async()=>{await api('/nodes/'+evidence.node_id+'/reviews',{method:'POST',body:JSON.stringify({expected_version:evidence.version,decision:'approved',reviewer:'demo-reviewer',note:'界面审核确认'})});await reload();q('#detail').close()};actions.append(approve)}q('#detail').showModal()}
async function reload(){const graph=await api('/tasks/'+state.task.task_id+'/graph');state.nodes=graph.nodes;q('#task-state').textContent='任务 '+state.task.task_id.slice(0,8)+' · '+state.nodes.filter(n=>n.review_status==='pending_review').length+' 项待审核';q('#freeze').disabled=false;render()}
q('#create').onclick=async()=>{try{state.task=await api('/tasks',{method:'POST',body:JSON.stringify({region_code:'110108',year:2024,boundary_version:q('#boundary').value,standard_version:'GB/T 46869-2025',data_version:q('#data-version').value})});await reload()}catch(e){q('#message').textContent=e.message}};
q('#freeze').onclick=async()=>{try{const result=await api('/tasks/'+state.task.task_id+'/snapshots',{method:'POST',body:'{}'});q('#message').textContent='已冻结快照 '+result.snapshot_id}catch(e){q('#message').textContent='正式核算被阻断：'+e.body.blocking_nodes.join('、')}};q('#close').onclick=()=>q('#detail').close();
</script></body></html>
