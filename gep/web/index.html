<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>海淀区 2024 GEP 核算任务</title>
  <style>
    :root{font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#172033;background:#f7f8fa}body{margin:0}.shell{max-width:1280px;margin:auto;background:#fff;min-height:100vh}.head,.bar{padding:16px 24px;border-bottom:1px solid #e7eaf0;display:flex;justify-content:space-between;gap:16px;align-items:center}.head small,.muted{color:#667085}.bar{background:#fbfcfe;flex-wrap:wrap}.grid{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.group{border:1px solid #dde3ee;border-radius:10px;padding:14px;background:#fcfdff}.group h2{font-size:16px;margin:0 0 10px}.node{width:100%;text-align:left;margin:5px 0;padding:9px;border:1px solid #e4e9f1;background:white;border-radius:6px;cursor:pointer}.node:hover{border-color:#3370ff}.state{float:right;font-size:12px;color:#a15c00}.panel{margin:0 24px 24px;padding:18px;border:1px solid #dce5f5;border-radius:10px;background:#f9fbff}.panel[hidden]{display:none}.task-list{display:grid;gap:8px;margin-top:10px}.task{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border:1px solid #e4e9f1;border-radius:6px;background:#fff}.task small{color:#667085}button{padding:8px 12px;border-radius:6px;border:1px solid #cbd5e1;background:white;cursor:pointer}.primary{background:#3370ff;color:white;border-color:#3370ff}input{padding:8px;border:1px solid #cbd5e1;border-radius:5px}dialog{max-width:620px;border:1px solid #d9e1ef;border-radius:10px;box-shadow:0 16px 45px #17203335}pre{white-space:pre-wrap;word-break:break-word;background:#f4f6fa;padding:12px;border-radius:6px}
  </style>
</head>
<body><main class="shell">
  <header class="head"><div><strong>GEP 智能核算</strong><small>　海淀区 · 2024 年 · 366 天</small></div><span id="task-state" class="muted">创建任务以加载真实参考数据</span></header>
  <section class="bar"><div>边界 <input id="boundary" value="pending-confirmation">　数据版本 <input id="data-version" value="reference-2024-v0.1"></div><button id="create" class="primary">新建核算任务</button><button id="freeze" disabled>生成核算快照</button><button id="readiness" disabled>确认核算方案</button><button id="execute-run" disabled>执行核算</button><button id="appendix-e" disabled>查看待完善附录 E</button><span id="view-tools" hidden><button id="zoom-out">缩小</button><button id="zoom-in">放大</button><button id="collapse-all">折叠全部</button><button id="expand-all">展开全部</button></span></section>
  <section id="message" class="panel">当前仅加载已审核参考包；缺少来源或待审核输入不会被当作零值，且不能生成正式总 GEP。</section>
  <section id="task-list" class="panel"><strong>任务中心</strong><div id="task-list-body" class="task-list"><span class="muted">正在读取持久化任务…</span></div></section>
  <section id="package" class="panel" hidden><strong>数据包准入</strong><pre id="package-body"></pre></section>
  <section id="readiness-panel" class="panel" hidden><strong>核算方案确认</strong><pre id="readiness-body"></pre></section>
  <section id="run-panel" class="panel" hidden><strong>执行与结果复核</strong><pre id="run-body"></pre></section>
  <section id="appendix" class="panel" hidden><strong>附录 E（待完善）</strong><pre id="appendix-body"></pre></section>
  <section id="events" class="panel" hidden><strong>事件记录</strong><pre id="event-body"></pre></section>
  <section id="graph" class="grid" aria-live="polite"></section>
  <dialog id="detail"><button id="close">关闭</button><h2 id="detail-title"></h2><p id="detail-state" class="muted"></p><pre id="detail-body"></pre><div id="actions"></div></dialog>
</main><script>
const state={task:null,nodes:[],layout:{zoom:1,collapsed:{},positions:{}},snapshotId:null,runKeys:{},lastEvent:0,eventTimer:null};const q=s=>document.querySelector(s);const apiBase='/api';const api=(path,opts={})=>fetch(apiBase+path,{headers:{'Content-Type':'application/json'},...opts}).then(async r=>{const body=await r.json();if(!r.ok)throw Object.assign(new Error(body.error),{body,status:r.status});return body});
const label=n=>n.review_status==='approved'?'审核通过':n.review_status==='pending_review'?'待审核':n.acquisition_status==='awaiting_agent'?'待智能体补充':'待人工协助';
const layoutKey=()=>state.task?'haidian-gep:view-layout:'+state.task.task_id:'';
function loadLayout(){try{const saved=JSON.parse(localStorage.getItem(layoutKey())||'{}');return {zoom:Number.isFinite(saved.zoom)?Math.min(1.6,Math.max(.6,saved.zoom)):1,collapsed:saved.collapsed||{},positions:saved.positions||{}}}catch(_){return {zoom:1,collapsed:{},positions:{}}}}
function saveLayout(){if(layoutKey())localStorage.setItem(layoutKey(),JSON.stringify(state.layout))}
function moveNode(event,button,node){if(event.button!==0)return;const point=state.layout.positions[node.node_key]||{x:0,y:0};const start={x:event.clientX,y:event.clientY};let moved=false;button.setPointerCapture(event.pointerId);const drag=next=>{const x=point.x+next.clientX-start.x,y=point.y+next.clientY-start.y;moved=moved||Math.abs(x-point.x)>4||Math.abs(y-point.y)>4;button.style.transform='translate('+x+'px,'+y+'px)';state.layout.positions[node.node_key]={x,y}};const stop=next=>{button.releasePointerCapture(next.pointerId);button.removeEventListener('pointermove',drag);button.removeEventListener('pointerup',stop);if(moved){button.dataset.moved='1';saveLayout();setTimeout(()=>delete button.dataset.moved,0)}};button.addEventListener('pointermove',drag);button.addEventListener('pointerup',stop)}
function render(){const graph=q('#graph');graph.replaceChildren();graph.style.zoom=state.layout.zoom;for(const category of ['material','regulating','cultural']){const box=document.createElement('section');box.className='group';const names={material:'物质产品',regulating:'调节服务',cultural:'文化服务'};const collapsed=Boolean(state.layout.collapsed[category]);box.innerHTML='<h2>'+names[category]+' <button class="fold">'+(collapsed?'展开':'折叠')+'</button></h2>';box.querySelector('.fold').onclick=()=>{state.layout.collapsed[category]=!collapsed;saveLayout();render()};if(!collapsed){for(const node of state.nodes.filter(n=>n.kind==='indicator'&&n.category===category)){const b=document.createElement('button');b.className='node';b.textContent=node.node_key+' · '+node.label;const s=document.createElement('span');s.className='state';s.textContent=label(node);b.append(s);const point=state.layout.positions[node.node_key]||{x:0,y:0};b.style.transform='translate('+point.x+'px,'+point.y+'px)';b.addEventListener('pointerdown',event=>moveNode(event,b,node));b.onclick=event=>{if(b.dataset.moved){event.preventDefault();return}show(node)};box.append(b)}}graph.append(box)}}
function renderPackage(data){q('#package').hidden=false;q('#package-body').textContent=JSON.stringify({data_version:data.data_version,release_verification:data.release_verification,accounting_ready:data.accounting_ready,full_gep_computed:data.full_gep_computed,alphaearth_candidates:data.alphaearth_candidates,remaining:data.remaining,missing_input_count:data.missing_input_count},null,2)}
function renderReadiness(report){q('#readiness-panel').hidden=false;q('#readiness-body').textContent=JSON.stringify({graph_version:report.graph_version,ready_for_snapshot:report.ready_for_snapshot,blocking_node_count:report.blocking_node_count,blocking_nodes:report.blocking_nodes},null,2)}
function renderRun(run,chain){q('#run-panel').hidden=false;q('#run-body').textContent=JSON.stringify({run_id:run.run_id,status:run.status,reason:run.reason,formal_gep_value_yuan:chain.calculation.formal_gep_value_yuan,partial_category_totals_yuan:chain.calculation.partial_category_totals_yuan,item_results:chain.calculation.item_results,blocking_nodes:chain.calculation.blocking_nodes},null,2)}
function renderAppendix(report){q('#appendix').hidden=false;q('#appendix-body').textContent=JSON.stringify({report_type:report.report_type,formal_gep_value:report.formal_gep_value,row_count:report.row_count,rows:report.rows.map(row=>({indicator_id:row.indicator_id,label:row.label,category:row.category,applicability_status:row.applicability_status,review_status:row.review_status,status:row.status,blocking_nodes:row.blocking_nodes,input_nodes:row.input_nodes.map(input=>({node_key:input.node_key,value:input.value,unit:input.unit,acquisition_status:input.acquisition_status,review_status:input.review_status,evidence:input.evidence}))}))},null,2)}
function renderTasks(tasks){const target=q('#task-list-body');target.replaceChildren();if(!tasks.length){target.innerHTML='<span class="muted">尚无持久化任务。</span>';return}for(const task of tasks){const item=document.createElement('div');item.className='task';const latest=task.latest_run?task.latest_run.status:'尚无运行';item.innerHTML='<div><strong>海淀 '+task.year+' · 图版本 '+task.graph_version+'</strong><br><small>待审 '+task.pending_review_count+' · 正式阻断 '+task.formal_blocker_count+'（图内 '+task.node_blocker_count+'）· 补充阻断 '+task.blocked_supplement_count+' · '+latest+'</small></div>';const open=document.createElement('button');open.textContent='恢复任务';open.onclick=()=>openTask(task);item.append(open);target.append(item)}}
async function loadTasks(){renderTasks((await api('/tasks')).tasks)}
function renderEvents(events){if(!events.length)return;q('#events').hidden=false;q('#event-body').textContent=JSON.stringify(events.map(event=>({sequence:event.sequence,type:event.type,created_utc:event.created_utc,payload:event.payload})),null,2)}
async function pollEvents(){if(!state.task)return;try{const update=await api('/tasks/'+state.task.task_id+'/events?after='+state.lastEvent);if(!update.events.length)return;state.lastEvent=update.events[update.events.length-1].sequence;renderEvents(update.events);await reload()}catch(error){q('#message').textContent='事件恢复失败：'+error.message}}
function startPolling(){if(state.eventTimer)clearInterval(state.eventTimer);state.eventTimer=setInterval(pollEvents,5000);pollEvents()}
async function openTask(task){try{state.task={task_id:task.task_id};state.lastEvent=0;await reload();startPolling();q('#message').textContent='已从持久化服务恢复任务 '+task.task_id.slice(0,8)+'。'}catch(error){q('#message').textContent='恢复任务失败：'+error.message}}
async function show(node){const inputs=node.kind==='indicator'?state.nodes.filter(n=>n.parent_key===node.node_key):[];let details=node;if(node.node_key==='P1'){details=state.nodes.find(n=>n.node_key==='P1.maize.quantity')||node}const evidence=await api('/nodes/'+details.node_id+'/evidence');q('#detail-title').textContent=node.kind==='indicator'?node.node_key+' · '+node.label:details.label;q('#detail-state').textContent=label(evidence)+' · 版本 '+evidence.version;q('#detail-body').textContent=JSON.stringify({value:evidence.value,unit:evidence.unit,evidence:evidence.evidence,required_inputs:inputs.map(input=>({node_key:input.node_key,label:input.label,value:input.value,unit:input.unit,acquisition_status:input.acquisition_status,review_status:input.review_status}))},null,2);const actions=q('#actions');actions.replaceChildren();if(evidence.review_status==='pending_review'){for(const [decision,text] of [['approved','审核通过'],['returned','退回重查']]){const button=document.createElement('button');button.className=decision==='approved'?'primary':'';button.textContent=text;button.onclick=async()=>{const note=prompt(decision==='approved'?'审核意见':'退回原因');if(!note)return;await api('/nodes/'+evidence.node_id+'/reviews',{method:'POST',body:JSON.stringify({expected_version:evidence.version,decision,note})});await reload();q('#detail').close()};actions.append(button)}}const correct=document.createElement('button');correct.textContent='人工纠正';correct.onclick=async()=>{const value=prompt('修正后的数值',evidence.value);const source_id=prompt('修正依据的来源 ID');const locator=prompt('定位信息（文件、表格、页码或台账行）');if(value===null||!source_id||!locator)return;await api('/nodes/'+evidence.node_id+'/revisions',{method:'POST',body:JSON.stringify({expected_version:evidence.version,value:Number(value),unit:evidence.unit,reason:'人工纠正',evidence:{source_id,source_type:'manual_correction',locator}})});await reload();q('#detail').close()};actions.append(correct);q('#detail').showModal()}
async function reload(){const graph=await api('/tasks/'+state.task.task_id+'/graph');const snapshots=await api('/tasks/'+state.task.task_id+'/snapshots');state.nodes=graph.nodes;state.snapshotId=snapshots.snapshots[0]?.snapshot_id||null;state.layout=loadLayout();q('#task-state').textContent='任务 '+state.task.task_id.slice(0,8)+' · '+state.nodes.filter(n=>n.review_status==='pending_review').length+' 项待审核';q('#freeze').disabled=false;q('#readiness').disabled=false;q('#execute-run').disabled=!state.snapshotId;q('#appendix-e').disabled=false;q('#view-tools').hidden=false;render();await loadTasks()}
q('#create').onclick=async()=>{try{const dataVersion=q('#data-version').value;const dataPackage=await api('/data-versions/'+encodeURIComponent(dataVersion));renderPackage(dataPackage);state.task=await api('/tasks',{method:'POST',body:JSON.stringify({region_code:'110108',year:2024,boundary_version:q('#boundary').value,standard_version:'GB/T 46869-2025',data_version:dataVersion})});state.lastEvent=0;await reload();startPolling()}catch(e){q('#message').textContent=e.message}};
q('#freeze').onclick=async()=>{try{const result=await api('/tasks/'+state.task.task_id+'/snapshots',{method:'POST',body:'{}'});state.snapshotId=result.snapshot_id;q('#execute-run').disabled=false;q('#message').textContent='已冻结快照 '+result.snapshot_id}catch(e){q('#message').textContent='正式核算被阻断：'+e.body.blocking_nodes.join('、')}};q('#close').onclick=()=>q('#detail').close();
q('#readiness').onclick=async()=>{try{renderReadiness(await api('/tasks/'+state.task.task_id+'/readiness'));q('#message').textContent='已读取当前核算方案确认结果；未创建快照。'}catch(e){q('#message').textContent='读取核算方案确认结果失败：'+e.message}};
q('#execute-run').onclick=async()=>{try{const key=state.runKeys[state.snapshotId]||(state.runKeys[state.snapshotId]='web-'+Date.now()+'-'+Math.random().toString(16).slice(2));const run=await api('/runs',{method:'POST',body:JSON.stringify({snapshot_id:state.snapshotId,idempotency_key:key})});renderRun(run,await api('/runs/'+run.run_id+'/chain'));q('#message').textContent=run.status==='succeeded'?'已完成正式核算。':'已保存受阻运行与分项结果；正式总值仍未生成。';await loadTasks()}catch(e){q('#message').textContent='请求核算失败：'+e.message}};
q('#appendix-e').onclick=async()=>{try{renderAppendix(await api('/tasks/'+state.task.task_id+'/appendix-e'));q('#message').textContent='已展示当前任务的待完善附录 E；正式 GEP 仍为 null，直到快照和运行链全部通过。'}catch(e){q('#message').textContent='读取附录 E 失败：'+e.message}};
q('#zoom-out').onclick=()=>{state.layout.zoom=Math.max(.6,Math.round((state.layout.zoom-.1)*10)/10);saveLayout();render()};q('#zoom-in').onclick=()=>{state.layout.zoom=Math.min(1.6,Math.round((state.layout.zoom+.1)*10)/10);saveLayout();render()};q('#collapse-all').onclick=()=>{for(const category of ['material','regulating','cultural'])state.layout.collapsed[category]=true;saveLayout();render()};q('#expand-all').onclick=()=>{state.layout.collapsed={};saveLayout();render()};
loadTasks().catch(error=>q('#task-list-body').textContent='读取任务中心失败：'+error.message);
</script></body></html>
